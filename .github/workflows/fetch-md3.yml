name: Fetch MD3 Artifacts (Local Fat Mirror)

on:
  schedule:
    - cron: '0 0 * * *' # 每天自动执行
  workflow_dispatch:
    inputs:
      force_run:
        description: "强制拉取(无视版本一致性检查)"
        type: boolean
        default: false

jobs:
  mirror-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Check and Compare Versions (对比最新官方版本)"
        id: check_versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION=$(curl -s https://dl.google.com/dl/android/maven2/com/google/android/material/material/maven-metadata.xml | grep -oP '<release>\K[^<]+')
          WEB_VERSION=$(npm view @material/web version)

          [ -z "$APP_VERSION" ] && APP_VERSION="unknown-app"
          [ -z "$WEB_VERSION" ] && WEB_VERSION="unknown-web"

          UPSTREAM_COMBO="${WEB_VERSION}_${APP_VERSION}"
          echo "官方最新二进制版本: $UPSTREAM_COMBO"

          LATEST_RELEASE=$(gh release view --json tagName -q ".tagName" 2>/dev/null || echo "none")
          CURRENT_COMBO=$(echo "$LATEST_RELEASE" | sed -E 's/-build\..*//')

          FORCE_RUN="${{ inputs.force_run }}"
          if [ "$UPSTREAM_COMBO" == "$CURRENT_COMBO" ] && [ "$FORCE_RUN" != "true" ]; then
            echo "✅ 官方成品库无更新，停止镜像同步。"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "🚀 发现新版本二进制包，准备下载镜像！"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "web_version=$WEB_VERSION" >> $GITHUB_OUTPUT
            echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
            TIME_MARKER=$(date +'%Y%m%d-%H%M')
            echo "our_tag=${UPSTREAM_COMBO}-build.${TIME_MARKER}" >> $GITHUB_OUTPUT
          fi

      - name: "Download Artifacts (构建离线胖镜像仓库)"
        if: steps.check_versions.outputs.skip == 'false'
        run: |
          APP_V=${{ steps.check_versions.outputs.app_version }}
          WEB_V=${{ steps.check_versions.outputs.web_version }}

          # ==========================================
          # 📦 1. 构建 Android 本地 Maven 胖镜像库 (Fat Mirror)
          # ==========================================
          
          # 清理 Action 服务器上的遗留 Gradle 缓存，确保提取纯净
          rm -rf ~/.gradle/caches/modules-2/files-2.1
          
          mkdir md3-gradle-resolver
          cd md3-gradle-resolver
          
          # 1.1 动态创建一个极简的、原生的 Gradle 工程
          cat <<EOF > build.gradle
          repositories {
              google()
              mavenCentral()
          }
          configurations {
              md3
          }
          dependencies {
              md3 "com.google.android.material:material:${APP_V}"
          }
          task fetch {
              doLast {
                  // 这一步会让 Gradle 按照 Android 的规则完美处理冲突，并下载所有的 AAR、JAR 和 POM
                  configurations.md3.resolve()
              }
          }
          EOF
          
          # 1.2 执行 Gradle 任务进行依赖解析与下载
          gradle fetch --no-daemon
          
          # 1.3 构建目标 Maven 镜像库结构
          TARGET_DIR="${{ github.workspace }}/md3-android-repo"
          mkdir -p "$TARGET_DIR"
          
          # 1.4 【黑科技核心】遍历杂乱的 Gradle 缓存，剥离 hash 文件夹，重组为完美的 Maven 仓库
          find ~/.gradle/caches/modules-2/files-2.1/ -type f | while read -r filepath; do
              # 过滤非必要文件
              [[ "$filepath" != *"/files-2.1/"* ]] && continue
              
              # 截取相对路径 (如: androidx.core/core/1.13.0/abc123hash/core-1.13.0.aar)
              relpath="${filepath#*/files-2.1/}"
              IFS='/' read -ra parts <<< "$relpath"
              
              # 确保深度足够 (groupId/artifactId/version/hash/filename)
              if [ ${#parts[@]} -lt 5 ]; then continue; fi
              
              group_id="${parts[0]}"
              artifact_id="${parts[1]}"
              version="${parts[2]}"
              filename="${parts[4]}"
              
              # 转换 Group ID 为路径格式 (androidx.core -> androidx/core)
              group_path="${group_id//.//}"
              dest_dir="$TARGET_DIR/$group_path/$artifact_id/$version"
              
              # 复制文件到最终的 Maven 结构中
              mkdir -p "$dest_dir"
              cp "$filepath" "$dest_dir/$filename"
          done
          
          # 1.5 手动兜底：补齐 MD3 自身的特殊文件（Sources 源码 和 Module 描述文件）
          cd "$TARGET_DIR/com/google/android/material/material/$APP_V"
          BASE_URL="https://dl.google.com/dl/android/maven2/com/google/android/material/material/$APP_V"
          curl -sLO "$BASE_URL/material-$APP_V-sources.jar" || true
          curl -sLO "$BASE_URL/material-$APP_V.module" || true
          curl -sLO "$BASE_URL/material-$APP_V.pom" || true
          
          # 1.6 打包 Android 全量镜像库
          cd ${{ github.workspace }}
          zip -r md3-android-maven-repo.zip md3-android-repo

          # ==========================================
          # 📦 2. 构建 Web NPM 本地镜像包
          # ==========================================
          mkdir md3-web-pkg
          cd md3-web-pkg
          npm pack @material/web@$WEB_V
          tar -xzf *.tgz --strip-components=1
          rm *.tgz
          
          # 退回根目录并打包
          cd ..
          zip -r md3-web-npm-pkg.zip md3-web-pkg

      - name: "Create Release"
        if: steps.check_versions.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_versions.outputs.our_tag }}
          name: "MD3 官方全量镜像包 (Web: ${{ steps.check_versions.outputs.web_version }} | App: ${{ steps.check_versions.outputs.app_version }})"
          body: |
            自动拉取的 Google 官方最新 MD3 编译成品，**包含完整的底层依赖树（完美兼容 Gradle 的胖镜像）**！
            - 🌐 **Web 版本**: `${{ steps.check_versions.outputs.web_version }}`
            - 📱 **App 版本**: `${{ steps.check_versions.outputs.app_version }}`
            - 🔖 **发布标识**: `${{ steps.check_versions.outputs.our_tag }}`

            ---

            ### 💡 极简使用指南（一行路径引入）

            #### 👉 Android / 应用开发 (纯正的本地 Maven 玩法)
            1. 下载 `md3-android-maven-repo.zip` 并解压到项目根目录（文件夹名为 `md3-android-repo`）。
            2. 在你的 `settings.gradle` (或根目录 `build.gradle`) 的仓库列表中，**加一行本地路径**：
               ```gradle
               dependencyResolutionManagement {
                   repositories {
                       google()
                       mavenCentral()
                       // 添加下面这行，彻底离线可用！
                       maven { url uri("$rootDir/md3-android-repo") }
                   }
               }
               ```
            3. 在 App 中正常引入：
               `implementation 'com.google.android.material:material:${{ steps.check_versions.outputs.app_version }}'`

            #### 👉 Web / 前端开发
            1. 下载 `md3-web-npm-pkg.zip` 解压到项目根目录命名为 `md3-web-pkg`。
            2. 在你的 `package.json` 中添加：
               ```json
               "dependencies": {
                 "@material/web": "file:./md3-web-pkg"
               }
               ```
            3. 执行 `npm install` 即可！
          files: |
            md3-android-maven-repo.zip
            md3-web-npm-pkg.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2